name: Validate

on:
  push:
    branches:
      - main
      - codex/emergency-safe-release
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @emergency-protocol-diagram/server

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Reference scenario report
        run: |
          mkdir -p apps/client/artifacts/reference-scenarios
          npm run test:reference-scenarios -- --reporter=default --reporter=json --outputFile.json=artifacts/reference-scenarios/results.json

      - name: Upload reference scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-scenario-results
          path: apps/client/artifacts/reference-scenarios/results.json
          if-no-files-found: error

      - name: Enforce scoped coverage gates
        run: npm run test:coverage
